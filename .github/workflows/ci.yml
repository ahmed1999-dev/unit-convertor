name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
   test:
       runs-on: ubuntu-latest
       steps:
          - name: checkout main branch
            uses: actions/checkout@v6
          
          - name: install python
            uses: actions/setup-python@v5
            with: 
                python-version: '3.11'

          - name: Install dependencies
            run: |
              python -m pip install -U pip wheel
              python -m pip install -e ".[dev]"
          - name: Quick CLI smoke test
            run: units-convert --help || (echo "CLI is missing" && exist 1)

          - name: Run tests
            run:
              pytest
          